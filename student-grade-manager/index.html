<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Manager App</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    
    <h1>Student Grade Manager</h1>
    
    <input type="text" class="course-code code" placeholder="Input Course code">
    <input type="text" class="course-title title" placeholder="Input Course title">
    <input type="text" class="course-unit unit" placeholder="Input Course unit">
    <input type="text" class="course-grade grade" placeholder="Input Course grade">
    

    <div class="buttons-div">
        <button class="add-btn">Add course</button>
        <button class="remove-all">Remove all courses</button>
        <button class="gpa-calculator">GPA</button>
        <p class="display-gpa"></p>
    </div>

    <div class="all-display-div">
            <div class="display-head-div">
                <div class="display1">Course Code</div>
                <div class="display2">Course title</div>
                <div class="display3">Course Unit</div>
                <div class="display4">Course Grade</div>
            </div>
            <div class="display-course"></div>
        </div>

    <script src="index.js"></script>
</body>
</html>
